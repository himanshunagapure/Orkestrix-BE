# Local nginx config for serving generated Angular apps from LIBERTY_FS_ROOT.
# Mirrors production (e.g. liberty-fs.gibots.com:843, uat-fs.aiqod.com:453).
#
# Install:
#   sudo cp local-dev/nginx/liberty-fs.conf /etc/nginx/sites-available/liberty-fs.conf
#   sudo ln -sf /etc/nginx/sites-available/liberty-fs.conf /etc/nginx/sites-enabled/liberty-fs.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Set in backend/config.json:
#   "LIBERTY_FS_ROOT": "/home/user/publicfolder/liberty_fs"
#   "LIBERTY_FS_BASE_URL": "http://localhost:843"

server {
    listen 843;
    listen [::]:843;
    server_name localhost;

    root /home/user/publicfolder/liberty_fs;
    index index.html;

    # Follow symlinks like {screen_id} -> {screen_id}-v{version}
    disable_symlinks off;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Allow iframe embedding from local frontend dev servers
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # Cache hashed Angular assets; always revalidate index.html
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
